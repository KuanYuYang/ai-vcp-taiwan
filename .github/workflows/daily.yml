name: Taiwan VCP daily scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "reports/**"
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-vcp-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update two-year historical OHLCV
        run: python src/history.py
      - name: Run VCP scanner
        run: python src/scanner.py
      - name: Run historical event study\n        run: python src/backtest.py\n      - name: Commit database and latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update Taiwan OHLCV and VCP report"
            git push
          fi
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-vcp-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
