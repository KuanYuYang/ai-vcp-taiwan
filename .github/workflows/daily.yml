name: Taiwan VCP daily scan

on:
  schedule:
    # 14:30 Taiwan time, after 13:30 close; GitHub schedule is UTC.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-vcp-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect market snapshot
        run: python src/scanner.py
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: update Taiwan market snapshot"
            git push
          fi
      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: ai-vcp-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
